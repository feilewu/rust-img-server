name: Build image (Ubuntu)

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-img-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup default stable
          rustc --version
          cargo --version

      - name: Build img server
        run: |
          . "$HOME/.cargo/env"
          cargo build --release
          chmod +x target/release/img-server

      - name: Upload img server bin
        uses: actions/upload-artifact@v4
        with:
          path: ./target/release/img-server
          name: img-server-bin-${{ github.sha }}
          retention-days: 1

  build-image-and-push:
    needs: build-img-server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          version=$(grep '^version =' Cargo.toml | sed 's/version = "//;s/"//g')
          echo "version:"$version
          echo "VERSION=${version}" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: img-server-bin-${{ github.sha }}
          path: ./target/release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DockerFile
          push: true
          tags: pfxuresources/img-server:ubuntu_v${{ env.VERSION }}
